[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-qual"
version = "0.1.0"
description = "Risk-informed qualification toolkit for remote robots under latency, sensor noise, and radiation dose."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Ria Cheruvu" }]
keywords = [
  "robotics",
  "nuclear",
  "reachability",
  "importance-sampling",
  "teleoperation",
  "safety",
  "qualification",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.22",
  "torch>=1.13",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6"]
dev = ["pytest>=7.0", "matplotlib>=3.6", "ruff>=0.1"]

[project.scripts]
remote-qual = "remote_qual.cli:main"

[project.urls]
Homepage = "https://github.com/riacheruvu/nuclear-robotic-shutdown"
Documentation = "https://riacheruvu.github.io/nuclear-robotic-shutdown/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
