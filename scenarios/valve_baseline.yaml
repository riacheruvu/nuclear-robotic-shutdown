# Baseline remote-valve approach (matches the original project demo pose).
#
# Plain English: the robot starts a bit away from the valve, drives home with
# a simple heading controller, while we estimate how often safety fails under
# slip + sensor scrambles, and whether formal reachability boxes leave the corridor.

name: valve_baseline
description: >
  Nominal remote approach to a manual valve under a simplified Co-60 point-source
  dose field, fixed 2-step command lag, and defensive-mixture importance sampling.
seed: 42

robot:
  initial_pose: [1.2, 0.6, 3.4906585]   # x [m], y [m], theta [rad] (~200 deg)
  dynamics: lag_unicycle
  lag_steps: 2
  controller: proportional_heading
  controller_params:
    k_p: 2.5
    v_nominal: 0.5

environment:
  dt: 0.1
  horizon: 100
  hazard: point_source_co60
  hazard_params:
    activity_ci: 15.0
    gamma_const: 1.32          # R·m²/(h·Ci) table constant (research model)
    mu_air: 0.0001
    d_bg_msv_s: 0.05           # lumped ambient term (see docs/ASSUMPTIONS.md)
    valve_pos: [0.0, 0.0]
    # source_pos defaults to valve_pos (colocated hot valve — stressful)
  task_radius_m: 0.15
  corridor_radius_m: 0.5

noise:
  model: slip_scramble
  params:
    sigma_slip: 0.05
    p_scramble: 0.05
    scramble_xy_range: 2.0

failure:
  model: dose_or_corridor

verification:
  reachability:
    enabled: true
    mode: receding              # receding | open_loop | both
    receding_window: 20         # re-certify every N steps on nominal
    compare_open_loop: true     # also report open-loop blow-up diagnostics
    blowup_growth_threshold: 50
    sigma_obs: 0.02
  rare_events:
    enabled: true
    method: defensive_mixture
    n_rollouts: 2000           # use 10000 for paper-style runs (CLI --rollouts)
    alpha: 0.7
    bias_factor: 2.2
  ablation: false

thresholds:
  min_mission_success: 0.90    # require lower 95% CI ≥ this
  max_p_fail: null             # report only unless set
  max_dose_msv: 50.0

output:
  save_plot: true
  save_animation: false
